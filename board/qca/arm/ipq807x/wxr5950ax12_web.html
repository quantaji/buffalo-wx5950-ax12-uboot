<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WXR-5950AX12 U-Boot Recovery Console</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #0c0f0d;
      --surface-raised: #1b211d;
      --line: #2d352f;
      --text: #ece9e1;
      --muted: #9ba49d;
      --recovery: #4ee39a;
      --nand: #f2a057;
      --usb: #df72a0;
      --danger: #f05240;
      --reboot: #e8b445;
      --radius: 18px;
      --shadow: 0 22px 70px rgb(0 0 0 / 28%);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      background:
        radial-gradient(circle at 12% -10%, rgb(78 227 154 / 13%), transparent 34rem),
        radial-gradient(circle at 100% 32%, rgb(242 160 87 / 10%), transparent 30rem),
        var(--background);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    button, input { font: inherit; }

    button:focus-visible,
    .file-picker:focus-within {
      outline: 3px solid rgb(236 233 225 / 30%);
      outline-offset: 3px;
    }

    .shell {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 26px;
    }

    .hero {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 22px;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0;
      font-size: clamp(23px, 2.5vw, 32px);
      line-height: 1.14;
      letter-spacing: -.035em;
    }

    .connection {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgb(21 26 23 / 82%);
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .connection-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--recovery);
      box-shadow: 0 0 0 4px rgb(69 196 134 / 12%);
    }

    .connection code { color: var(--text); }

    .upload-contract {
      margin: -7px 0 15px;
      color: var(--muted);
      font-size: 12px;
    }

    .project-footer {
      margin-top: 14px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    .project-footer a {
      color: var(--recovery);
      text-decoration: none;
    }

    .project-footer a:hover { text-decoration: underline; }

    .panel-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 12px;
    }

    .panel {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(160deg, rgb(27 33 29 / 96%), rgb(19 23 20 / 96%));
      box-shadow: var(--shadow);
    }

    .panel-recovery {
      --accent: var(--recovery);
      --accent-surface: #12613d;
      --accent-border: #2d8c5f;
    }

    .panel-nand {
      --accent: var(--nand);
      --accent-surface: #713b18;
      --accent-border: #a25c2b;
    }

    .panel-usb {
      --accent: var(--usb);
      --accent-surface: #6b2947;
      --accent-border: #984464;
    }

    .panel-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 20px;
      padding: 14px 18px 13px;
      border-bottom: 1px solid var(--accent-border);
      background: var(--accent-surface);
    }

    h2 {
      flex: 0 0 auto;
      margin: 0;
      font-size: 18px;
      letter-spacing: -.02em;
      white-space: nowrap;
    }

    .operation-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .panel-recovery .operation-grid {
      grid-template-columns: minmax(0, 1fr);
    }

    .operation {
      display: flex;
      flex-direction: column;
      padding: 13px 18px 15px;
    }

    .operation + .operation {
      border-left: 1px solid var(--line);
    }

    .operation-heading {
      display: flex;
      align-items: baseline;
      gap: 8px;
      min-width: 0;
      margin-bottom: 9px;
      white-space: nowrap;
    }

    .operation h3 {
      flex: 0 0 auto;
      margin: 0;
      font-size: 14px;
    }

    .format-hint {
      overflow: hidden;
      min-width: 0;
      margin: 0;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11px;
      text-overflow: ellipsis;
    }

    .reset-description {
      min-height: 40px;
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 11px;
    }

    .file-picker {
      display: flex;
      align-items: center;
      gap: 9px;
      min-height: 40px;
      margin-bottom: 8px;
      padding: 6px 8px;
      border: 1px dashed #3a443d;
      border-radius: 10px;
      background: #111512;
      cursor: pointer;
      transition: border-color 160ms ease, background 160ms ease;
    }

    .file-picker:hover {
      border-color: var(--accent);
      background: #141915;
    }

    .file-picker input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .choose-file {
      flex: 0 0 auto;
      padding: 5px 8px;
      border-radius: 7px;
      background: var(--surface-raised);
      color: var(--text);
      font-size: 11px;
      font-weight: 700;
    }

    .file-copy {
      min-width: 0;
    }

    .file-name,
    .file-meta {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-name {
      color: #d6d8d4;
      font-size: 12px;
      font-weight: 650;
    }

    .file-meta {
      color: #747d76;
      font-size: 10px;
    }

    .action-button,
    .reboot-button,
    .modal-button {
      width: 100%;
      min-height: 36px;
      border: 0;
      border-radius: 10px;
      color: #101410;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      transition: background-size 180ms ease, transform 120ms ease, filter 120ms ease, opacity 120ms ease;
    }

    .action-button:not(:disabled):hover,
    .reboot-button:hover,
    .modal-button:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    .action-button:disabled {
      cursor: not-allowed;
      filter: saturate(.35);
      opacity: .38;
    }

    .action-recovery {
      --button-color: var(--recovery);
    }

    .action-danger {
      --button-color: var(--danger);
      color: #fff7f3;
    }

    .action-button {
      --progress: 0%;
      margin-top: auto;
      background:
        linear-gradient(rgb(255 255 255 / 20%) 0 0) left / var(--progress) 100% no-repeat,
        var(--button-color);
    }

    .warning {
      display: flex;
      gap: 7px;
      margin: 6px 0 0;
      color: #a99a92;
      font-size: 10px;
    }

    .warning-mark {
      color: var(--danger);
      font-weight: 900;
    }

    .panel-log-detail {
      display: block;
      overflow-y: auto;
      max-height: 48px;
      margin: 0 18px 12px;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11px;
    }

    .panel-log-detail span {
      display: block;
    }

    .panel-log-detail:empty {
      display: none;
    }

    .reboot-action {
      margin-top: 14px;
    }

    .reboot-button {
      width: 100%;
      padding: 0 18px;
      background: var(--reboot);
    }

    dialog {
      width: min(440px, calc(100% - 32px));
      padding: 0;
      border: 1px solid #3a433d;
      border-radius: 16px;
      background: #171c18;
      color: var(--text);
      box-shadow: 0 28px 90px rgb(0 0 0 / 65%);
    }

    dialog::backdrop {
      background: rgb(3 5 4 / 74%);
      backdrop-filter: blur(3px);
    }

    .modal-content { padding: 25px; }

    .modal-content h2 {
      margin: 0 0 7px;
      font-size: 20px;
    }

    .modal-content > p {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 13px;
    }

    .modal-summary {
      display: grid;
      gap: 8px;
      margin-bottom: 21px;
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #101411;
    }

    .summary-row {
      display: grid;
      grid-template-columns: 65px minmax(0, 1fr);
      gap: 10px;
      font-size: 12px;
    }

    .summary-row[hidden] { display: none; }

    .summary-row span:first-child { color: var(--muted); }
    .summary-row strong { overflow-wrap: anywhere; }

    .modal-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .modal-button { background: #2b332d; color: var(--text); }
    .modal-confirm { background: var(--danger); color: #fff7f3; }
    .modal-confirm.recovery-confirm { background: var(--recovery); color: #101410; }
    .modal-confirm.reboot-confirm { background: var(--reboot); color: #101410; }

    @media (max-width: 620px) {
      .shell { width: min(100% - 22px, 1180px); padding-top: 28px; }
      .hero { align-items: flex-start; flex-direction: column; }
      .connection { align-self: stretch; justify-content: center; }
      .operation-grid { grid-template-columns: 1fr; }
      .operation + .operation { border-top: 1px solid var(--line); border-left: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div class="brand">
        <h1>Buffalo WXR-5950AX12 U-Boot Recovery Console</h1>
      </div>
      <div class="connection" aria-label="Web service status">
        <span class="connection-dot" aria-hidden="true"></span>
        <span>Web service ready</span>
        <code id="service-address">192.168.11.1</code>
      </div>
    </header>

    <p class="upload-contract">All uploads use one shared 128 MiB staging area. A new upload replaces the staged image.</p>

    <section class="panel-grid" id="panel-grid" aria-label="Recovery, installation, and configuration reset operations"></section>

    <div class="reboot-action">
      <button class="reboot-button" type="button" data-action="reboot">Reboot Router</button>
    </div>

    <footer class="project-footer">
      Project: <a href="https://github.com/quantaji/buffalo-wxr-5950ax12-uboot" target="_blank" rel="noopener noreferrer">quantaji/buffalo-wxr-5950ax12-uboot</a>
    </footer>

  </main>

  <dialog id="confirm-dialog" aria-labelledby="confirm-title">
    <div class="modal-content">
      <h2 id="confirm-title">Confirm Operation</h2>
      <p id="confirm-description">Verify the target and file before continuing.</p>
      <div class="modal-summary" id="modal-summary">
        <div class="summary-row"><span id="confirm-primary-label">Target</span><strong id="confirm-target"></strong></div>
        <div class="summary-row" data-file-summary><span>File</span><strong id="confirm-file"></strong></div>
        <div class="summary-row" data-file-summary><span>Size</span><strong id="confirm-size"></strong></div>
      </div>
      <div class="modal-actions">
        <button class="modal-button" type="button" id="cancel-confirm">Cancel</button>
        <button class="modal-button modal-confirm" type="button" id="accept-confirm">Confirm Install</button>
      </div>
    </div>
  </dialog>

  <script>
    const IMAGE_FORMATS = {
      recovery: { label: '*-initramfs-uImage.itb', accept: '.itb' },
      nandProduction: { label: '*-squashfs-sysupgrade.bin', accept: '.bin' },
      usbProduction: { label: '*-squashfs-usb-sysupgrade.bin', accept: '.bin' }
    };
    const PANELS = [
      {
        style: 'recovery',
        title: 'Memory Recovery',
        operations: [
          { title: 'Upload Recovery', target: 'Recovery in memory', format: 'recovery', action: 'recovery', endpoint: '/api/recovery/boot', button: 'Boot Recovery' }
        ]
      },
      {
        style: 'nand',
        title: 'Internal NAND',
        operations: [
          { title: 'Install Recovery', target: 'NAND Recovery', format: 'recovery', action: 'write', endpoint: '/api/nand/recovery', button: 'Install NAND Recovery', warning: 'Power loss while writing may damage the target partition.' },
          { title: 'Install Production', target: 'NAND Production', format: 'nandProduction', action: 'write', endpoint: '/api/nand/production', button: 'Install NAND Production', warning: 'Power loss while writing may damage the target partition.' },
          { title: 'Factory Reset', target: 'NAND rootfs_data', action: 'reset', endpoint: '/api/nand/reset', button: 'Reset NAND Configuration', description: 'Clear rootfs_data only; keep firmware, recovery, and calibration.', confirm: 'This clears only the NAND rootfs_data UBI volume. Installed firmware, recovery, and calibration data are not changed.', warning: 'Personal configuration and installed packages will be erased.' }
        ]
      },
      {
        style: 'usb',
        title: 'External USB',
        operations: [
          { title: 'Install Recovery', target: 'USB Recovery partition', format: 'recovery', action: 'write', endpoint: '/api/usb/recovery', button: 'Install USB Recovery', warning: 'Make sure the intended USB device is connected.' },
          { title: 'Install Production', target: 'USB Production partition', format: 'usbProduction', action: 'write', endpoint: '/api/usb/production', button: 'Install USB Production', warning: 'Make sure the intended USB device is connected.' },
          { title: 'Factory Reset', target: 'USB rootfs_data', action: 'reset', endpoint: '/api/usb/reset', button: 'Reset USB Configuration', description: 'Zero its first 1 MiB; ext4 is rebuilt on the next USB boot.', confirm: 'This writes zeros to the first 1 MiB of USB rootfs_data. OpenWrt recreates ext4 on the next USB Production boot.', warning: 'Personal configuration and installed packages will be erased.' }
        ]
      }
    ];

    function operationMarkup(operation) {
      const format = operation.format ? IMAGE_FORMATS[operation.format] : null;
      const buttonStyle = operation.action === 'recovery' ? 'action-recovery' : 'action-danger';
      const headingHint = format ? `<p class="format-hint">${format.label}</p>` : '';
      const control = format
        ? `<label class="file-picker">
            <input type="file" data-file-input accept="${format.accept}">
            <span class="choose-file">Choose file</span>
            <span class="file-copy">
              <span class="file-name">No file selected</span>
              <span class="file-meta">Select an image to continue</span>
            </span>
          </label>`
        : `<p class="reset-description">${operation.description}</p>`;
      const warning = operation.warning
        ? `<p class="warning"><span class="warning-mark">!</span>${operation.warning}</p>`
        : '';
      return `
        <div class="operation" data-operation data-target="${operation.target}"${operation.confirm ? ` data-confirm="${operation.confirm}"` : ''}>
          <div class="operation-heading">
            <h3>${operation.title}</h3>
            ${headingHint}
          </div>
          ${control}
          <button class="action-button ${buttonStyle}" type="button" data-action="${operation.action}" data-endpoint="${operation.endpoint}"${format ? ' disabled' : ''}>${operation.button}</button>
          ${warning}
        </div>`;
    }

    function renderPanels() {
      let markup = '';
      for (const panel of PANELS) {
        let operations = '';
        for (const operation of panel.operations) operations += operationMarkup(operation);
        markup += `
          <article class="panel panel-${panel.style}">
            <header class="panel-header">
              <h2>${panel.title}</h2>
            </header>
            <div class="operation-grid">${operations}</div>
            <span class="panel-log-detail" data-log-detail data-empty="true" aria-live="polite" aria-atomic="false"></span>
          </article>`;
      }
      document.querySelector('#panel-grid').innerHTML = markup;
    }

    renderPanels();
    document.querySelector('#service-address').textContent =
      window.location.hostname || '192.168.11.1';

    const inputs = [...document.querySelectorAll('[data-file-input]')];
    const actionButtons = [...document.querySelectorAll('[data-action]')];
    const dialog = document.querySelector('#confirm-dialog');
    const confirmTitle = document.querySelector('#confirm-title');
    const confirmDescription = document.querySelector('#confirm-description');
    const modalSummary = document.querySelector('#modal-summary');
    const confirmPrimaryLabel = document.querySelector('#confirm-primary-label');
    const confirmTarget = document.querySelector('#confirm-target');
    const confirmFile = document.querySelector('#confirm-file');
    const confirmSize = document.querySelector('#confirm-size');
    const fileSummaryRows = [...document.querySelectorAll('[data-file-summary]')];
    const cancelConfirm = document.querySelector('#cancel-confirm');
    const acceptConfirm = document.querySelector('#accept-confirm');
    let pendingButton = null;
    let activePanel = null;
    let busy = false;

    function formatBytes(bytes) {
      if (bytes === 0) return '0 B';
      const units = ['B', 'KiB', 'MiB', 'GiB'];
      const unit = Math.min(Math.floor(Math.log(bytes) / Math.log(1024)), units.length - 1);
      return `${(bytes / (1024 ** unit)).toFixed(unit === 0 ? 0 : 1)} ${units[unit]}`;
    }

    function setControlsDisabled(disabled) {
      actionButtons.forEach((button) => {
        if (button.dataset.action === 'reboot') {
          button.disabled = disabled;
          return;
        }
        const operation = button.closest('[data-operation]');
        const input = operation.querySelector('[data-file-input]');
        button.disabled = disabled || (input && !input.files[0]);
      });
      inputs.forEach((input) => { input.disabled = disabled; });
    }

    function handleFileChange(event) {
      const input = event.currentTarget;
      const operation = input.closest('[data-operation]');
      const file = input.files[0];
      const button = operation.querySelector('[data-action]');
      operation.querySelector('.file-name').textContent = file ? file.name : 'No file selected';
      operation.querySelector('.file-meta').textContent = file ? `${formatBytes(file.size)} · Ready to upload` : 'Select an image to continue';
      setButtonProgress(button, 0);
      button.disabled = !file || busy;
    }

    function showConfirmation(button) {
      pendingButton = button;
      const action = button.dataset.action;
      if (action === 'reboot') {
        confirmTitle.textContent = 'Reboot the router?';
        confirmDescription.textContent = 'The current Web session will end. No image will be installed. Any staged image will be discarded.';
        modalSummary.hidden = true;
        acceptConfirm.textContent = 'Reboot Router';
        acceptConfirm.classList.remove('recovery-confirm');
        acceptConfirm.classList.add('reboot-confirm');
      } else {
        const operation = button.closest('[data-operation]');
        modalSummary.hidden = false;
        confirmPrimaryLabel.textContent = 'Target';
        confirmTarget.textContent = operation.dataset.target;
        acceptConfirm.classList.remove('reboot-confirm');
        if (action === 'reset') {
          fileSummaryRows.forEach((row) => { row.hidden = true; });
          confirmTitle.textContent = 'Reset Configuration?';
          confirmDescription.textContent = operation.dataset.confirm;
          acceptConfirm.textContent = 'Confirm Reset';
          acceptConfirm.classList.remove('recovery-confirm');
        } else {
          const file = operation.querySelector('[data-file-input]').files[0];
          fileSummaryRows.forEach((row) => { row.hidden = false; });
          confirmFile.textContent = file.name;
          confirmSize.textContent = formatBytes(file.size);
        }
        if (action === 'recovery') {
          confirmTitle.textContent = 'Boot Recovery?';
          confirmDescription.textContent = 'No persistent storage will be modified. The current Web session will end after a successful validation.';
          confirmPrimaryLabel.textContent = 'Action';
          confirmTarget.textContent = 'Upload, validate, and boot from memory';
          acceptConfirm.textContent = 'Upload and Boot';
          acceptConfirm.classList.add('recovery-confirm');
        } else if (action !== 'reset') {
          confirmTitle.textContent = 'Confirm Persistent Write';
          confirmDescription.textContent = 'Verify the target and file. Do not remove power or media while writing.';
          acceptConfirm.textContent = 'Confirm Install';
          acceptConfirm.classList.remove('recovery-confirm');
        }
      }
      dialog.showModal();
    }

    function appendPanelLog(panel, message) {
      const log = panel.querySelector('[data-log-detail]');
      if (log.dataset.empty === 'true') {
        log.textContent = '';
        log.dataset.empty = 'false';
      }
      const line = document.createElement('span');
      line.textContent = message;
      log.append(line);
      log.scrollTop = log.scrollHeight;
    }

    function setButtonProgress(button, value) {
      button.style.setProperty('--progress', `${value}%`);
    }

    function beginAction(button) {
      busy = true;
      setControlsDisabled(true);
      activePanel = null;

      const request = new XMLHttpRequest();
      const isReboot = button.dataset.action === 'reboot';
      const endpoint = isReboot ? '/api/reboot' : button.dataset.endpoint;
      let file = null;

      if (button.dataset.action === 'reboot') {
        button.textContent = 'Rebooting…';
      } else {
        activePanel = button.closest('.panel');
        const operation = button.closest('[data-operation]');
        const input = operation.querySelector('[data-file-input]');
        file = input ? input.files[0] : null;
        setButtonProgress(button, 0);
        appendPanelLog(activePanel, file ? `Uploading ${file.name}` : `Starting ${operation.dataset.target} reset`);
      }

      request.open('POST', endpoint, true);
      if (file) {
        request.setRequestHeader('Content-Type', 'application/octet-stream');
        request.upload.onprogress = (event) => {
          if (event.lengthComputable) setButtonProgress(button, Math.round(event.loaded * 100 / event.total));
        };
      }
      request.onload = () => {
        if (isReboot) button.textContent = 'Reboot Router';
        if (activePanel) {
          const message = request.responseText.trim() || `HTTP ${request.status}`;
          appendPanelLog(activePanel, request.status >= 200 && request.status < 300 ? message : `Failed: ${message}`);
        }
        if (file && request.status >= 200 && request.status < 300) setButtonProgress(button, 100);
        busy = false;
        setControlsDisabled(false);
      };
      request.onerror = () => {
        if (isReboot) button.textContent = 'Reboot Router';
        if (activePanel) appendPanelLog(activePanel, button.dataset.action === 'recovery'
          ? 'Connection closed; recovery may be starting.'
          : 'Connection failed before the router confirmed the operation.');
        busy = false;
        setControlsDisabled(false);
      };
      request.send(file || null);
    }

    function handleActionClick(event) {
      showConfirmation(event.currentTarget);
    }

    function cancelConfirmation() {
      pendingButton = null;
      dialog.close();
    }

    function acceptConfirmation() {
      const button = pendingButton;
      pendingButton = null;
      dialog.close();
      beginAction(button);
    }

    function handleDialogClick(event) {
      if (event.target === dialog) {
        pendingButton = null;
        dialog.close();
      }
    }

    for (const input of inputs) input.addEventListener('change', handleFileChange);
    for (const button of actionButtons) button.addEventListener('click', handleActionClick);
    cancelConfirm.addEventListener('click', cancelConfirmation);
    acceptConfirm.addEventListener('click', acceptConfirmation);
    dialog.addEventListener('click', handleDialogClick);
  </script>
</body>
</html>
